databases:
  - name: chatr-db
    databaseName: chatr
    user: chatr_user
    plan: free

services:
  # Backend (API)
  - type: web
    name: chatr-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"

  # Frontend (Next.js)
  - type: web
    name: chatr-client
    env: node
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: chatr-server
          property: url
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: chatr-server
          property: url