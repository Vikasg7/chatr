services:
  # Database
  - type: db
    name: chatr-db
    databaseName: chatr
    user: chatr_user
    plan: free

  # Backend (API)
  - type: web
    name: chatr-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  # Frontend (Static/Web)
  - type: web
    name: chatr-client
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: chatr-server
          property: host
        value: https://${HOST}/api
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: chatr-server
          property: host
        value: wss://${HOST}
